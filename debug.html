<!DOCTYPE html>
<html>
<head>
<script>
window.errors = [];
window.onerror = function(msg, url, line, col, err) {
  window.errors.push({ type: 'onerror', msg, line, col, stack: err ? err.stack : null });
};
const origError = console.error;
console.error = function(...args) {
  window.errors.push({ type: 'console.error', args: args.map(a => String(a)) });
  origError.apply(console, args);
};
</script>
</head>
<body>
<div id="output"></div>
<script>
window.addEventListener('load', () => {
  // Read index.html scripts
});
</script>
</body>
</html>

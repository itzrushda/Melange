<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Melange - College Event Management Portal</title>

  <!-- Google Fonts & Font Awesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    /* ==========================================================================
       MELANGE EVENT MANAGEMENT PORTAL - MOBILE-FIRST STYLES
       Faithful to Official Figma UI Designs
       ========================================================================== */
    :root {
      --primary-purple: #1e1149;
      --deep-purple-gradient: linear-gradient(180deg, #1f0b4d 0%, #0d1b4c 100%);
      --accent-gold: #e5a93c;
      --accent-gold-dark: #b87d19;
      --accent-gold-light: #fbe29f;
      --melange-gold: #d89b34;
      --melange-blue: #1d4ed8;
      --melange-purple-btn: #4c1d95;
      --melange-purple-btn-gradient: linear-gradient(135deg, #44177d 0%, #5b21b6 100%);
      --melange-blue-btn-gradient: linear-gradient(135deg, #1d4ed8 0%, #2563eb 100%);
      --bg-gray: #f8fafc;
      --card-bg: #ffffff;
      --text-dark: #0f172a;
      --text-muted: #64748b;
      --text-sub: #475569;
      --border-light: #e2e8f0;
      --badge-green-bg: #dcfce7;
      --badge-green-text: #15803d;
      --badge-amber-bg: #fef3c7;
      --badge-amber-text: #b45309;
      --badge-red-bg: #fee2e2;
      --badge-red-text: #b91c1c;
      --badge-gray-bg: #f1f5f9;
      --badge-gray-text: #475569;
      --phone-width: 380px;
      --phone-height: 800px;
      /* safe-area fallback for notch phones */
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      /* Prevent elastic bounce scroll from showing background on iOS */
      background: #0b0f19;
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background-color: #0b0f19;
      color: var(--text-dark);
      /* Use dvh (dynamic viewport height) so iOS Safari address bar is accounted for */
      min-height: 100vh;
      min-height: 100dvh;
      height: 100dvh;
      overflow: hidden;         /* body itself does NOT scroll — inner screen-viewport does */
      display: flex;
      flex-direction: column;
    }

    /* Top Desktop Presentation Bar */
    .desktop-topbar {
      background: #111827;
      border-bottom: 1px solid #1f2937;
      color: #f3f4f6;
      padding: 10px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      z-index: 1000;
      position: sticky;
      top: 0;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-spark {
      color: #f59e0b;
      font-size: 1.25rem;
    }

    .brand-title {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-badge {
      background: #374151;
      color: #fbbf24;
      font-size: 0.7rem;
      padding: 2px 8px;
      border-radius: 9999px;
      font-weight: 600;
    }

    .controls-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }

    .ctrl-pill-btn {
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.15s ease;
    }

    .ctrl-pill-btn:hover {
      background: #374151;
      color: #ffffff;
    }

    .ctrl-pill-btn.active {
      background: #4f46e5;
      border-color: #6366f1;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
    }

    .ctrl-pill-btn.gold-active {
      background: #b45309;
      border-color: #f59e0b;
      color: #ffffff;
    }

    .view-select {
      background: #1f2937;
      border: 1px solid #374151;
      color: #e5e7eb;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      outline: none;
      cursor: pointer;
    }

    /* Main Presentation Stage */
    .presentation-stage {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px 10px 40px;
      background: radial-gradient(circle at 50% 20%, #1e1b4b 0%, #0b0f19 80%);
      /* Fill remaining height after the sticky top bar */
      min-height: 0;
      overflow: hidden;
    }

    /* Single Smartphone Frame */
    .phone-simulator-wrapper {
      position: relative;
      width: 100%;
      max-width: var(--phone-width);
      height: var(--phone-height);
      background: #000000;
      border-radius: 44px;
      box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.7), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      margin: 0 auto;
    }

    /* ---- On real phones: strip the bezel and fill 100% screen ---- */
    @media (max-width: 500px) {
      body {
        overflow: hidden;
      }

      .desktop-topbar {
        /* hide the desktop control bar on actual phones */
        display: none;
      }

      .presentation-stage {
        padding: 0;
        background: #f8fafc;
        /* fill the full viewport with no gaps */
        flex: 1;
        align-items: stretch;
        justify-content: stretch;
        min-height: 0;
      }

      .phone-simulator-wrapper {
        max-width: 100vw;
        width: 100%;
        /* Use dynamic viewport height so Safari address-bar is included */
        height: 100dvh;
        min-height: 100dvh;
        border-radius: 0;
        box-shadow: none;
      }
    }

    /* Phone Status Bar (12:30, WiFi, Battery) */
    .phone-status-bar {
      height: 36px;
      padding: 8px 18px 2px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.75rem;
      font-weight: 700;
      z-index: 100;
      flex-shrink: 0;
      user-select: none;
      color: #0f172a;
      background: transparent;
    }

    .phone-status-bar.dark-status {
      color: #ffffff;
    }

    .status-notch-cam {
      width: 12px;
      height: 12px;
      background: #000000;
      border-radius: 50%;
      box-shadow: inset 0 0 2px rgba(255, 255, 255, 0.4);
    }

    .status-icons {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.7rem;
    }

    /* Screen Viewport — fills all space between status bar and bottom nav */
    .screen-viewport {
      flex: 1;
      min-height: 0;          /* critical: allows flex child to shrink below content height */
      overflow-y: auto;
      overflow-x: hidden;
      background: #f8fafc;
      position: relative;
      display: flex;
      flex-direction: column;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;  /* prevent pull-to-refresh interfering */
    }

    .screen-viewport::-webkit-scrollbar {
      display: none;
    }

    /* Phone Bottom Home Bar */
    .phone-home-indicator {
      height: 16px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      z-index: 90;
      pointer-events: none;
    }

    .home-indicator-pill {
      width: 120px;
      height: 4px;
      background: #94a3b8;
      border-radius: 9999px;
    }

    .home-indicator-pill.dark-bar {
      background: rgba(255, 255, 255, 0.5);
    }

    /* ==========================================================================
       LOGO STYLING
       ========================================================================== */
    .melange-brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
    }

    .melange-logo-text {
      font-family: 'Great Vibes', cursive, 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 600;
      color: #d89b34;
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 70%, #92400e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      line-height: 1;
      letter-spacing: 0.5px;
    }

    .melange-logo-spark {
      display: inline-block;
      margin-left: -4px;
      margin-bottom: 12px;
      color: #f59e0b;
      filter: drop-shadow(0 2px 4px rgba(245, 158, 11, 0.4));
    }

    .melange-logo-text.light-gold {
      background: linear-gradient(135deg, #fef08a 0%, #facc15 50%, #eab308 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ==========================================================================
       AUTHENTICATION SCREENS (BOARD 1)
       ========================================================================== */
    .splash-container {
      flex: 1;
      background: linear-gradient(180deg, #1c0d45 0%, #0d1b4c 100%);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 40px 24px 30px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .splash-glow {
      position: absolute;
      width: 250px;
      height: 250px;
      background: radial-gradient(circle, rgba(234, 179, 8, 0.15) 0%, transparent 70%);
      top: 25%;
      border-radius: 50%;
      pointer-events: none;
    }

    .splash-center {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
      margin-top: 80px;
    }

    .portal-tag {
      font-size: 0.68rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #fef08a;
      font-weight: 700;
      margin-top: 4px;
      margin-bottom: 60px;
    }

    .spinner-ring {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(255, 255, 255, 0.15);
      border-top-color: #eab308;
      border-radius: 50%;
      animation: ringSpin 0.9s linear infinite;
      margin-top: 10px;
    }

    @keyframes ringSpin {
      to { transform: rotate(360deg); }
    }

    .splash-footer-text {
      font-size: 0.8rem;
      color: #cbd5e1;
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    /* Login Screen */
    .auth-page {
      flex: 1;
      background: #fbfbfe;
      display: flex;
      flex-direction: column;
      padding: 24px 24px;
    }

    .auth-header-center {
      text-align: center;
      margin-top: 10px;
      margin-bottom: 24px;
    }

    .auth-welcome-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin-top: 12px;
      margin-bottom: 4px;
    }

    .auth-welcome-sub {
      font-size: 0.85rem;
      color: #64748b;
      font-weight: 500;
    }

    .input-group {
      margin-bottom: 16px;
      position: relative;
    }

    .input-field-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon-left {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 0.9rem;
      pointer-events: none;
    }

    .input-icon-right {
      position: absolute;
      right: 14px;
      color: #94a3b8;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .melange-input {
      width: 100%;
      height: 48px;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 0 42px 0 42px;
      font-size: 0.88rem;
      font-family: inherit;
      color: #0f172a;
      outline: none;
      transition: all 0.2s ease;
    }

    .melange-input:focus {
      background: #ffffff;
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.12);
    }

    .show-password-row {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: #64748b;
      margin-top: -6px;
      margin-bottom: 24px;
    }

    .btn-melange-purple {
      width: 100%;
      height: 48px;
      background: var(--melange-purple-btn-gradient);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px -4px rgba(76, 29, 149, 0.4);
      transition: all 0.2s ease;
    }

    .btn-melange-purple:active {
      transform: scale(0.98);
      filter: brightness(0.95);
    }

    .btn-melange-blue {
      width: 100%;
      height: 48px;
      background: var(--melange-blue-btn-gradient);
      color: #ffffff;
      border: none;
      border-radius: 9999px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px -4px rgba(29, 78, 216, 0.35);
      transition: all 0.2s ease;
    }

    .btn-melange-blue:active {
      transform: scale(0.98);
    }

    .link-forgot {
      text-align: center;
      margin-top: 14px;
      font-size: 0.82rem;
      color: #64748b;
      cursor: pointer;
      font-weight: 600;
    }

    .link-forgot:hover {
      color: #4f46e5;
    }

    /* Role Selection Screen */
    .role-select-page {
      flex: 1;
      background: #f8fafc;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
    }

    .role-title {
      font-size: 1.35rem;
      font-weight: 800;
      text-align: center;
      margin-bottom: 24px;
      color: #0f172a;
    }

    .role-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px 20px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
      border: 1px solid #f1f5f9;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .role-icon-box {
      width: 52px;
      height: 52px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      margin-bottom: 12px;
    }

    .role-icon-admin {
      background: #fffbeb;
      color: #d97706;
      border: 1px solid #fef3c7;
    }

    .role-icon-gs {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #dbeafe;
    }

    .role-card-title {
      font-size: 1.1rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    .role-card-desc {
      font-size: 0.8rem;
      color: #64748b;
      margin-bottom: 18px;
    }

    /* Password Reset Screen */
    .reset-page {
      flex: 1;
      background: #ffffff;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
    }

    .reset-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      text-align: center;
      margin-top: 16px;
      margin-bottom: 8px;
    }

    .reset-desc {
      font-size: 0.82rem;
      color: #64748b;
      text-align: center;
      line-height: 1.4;
      margin-bottom: 28px;
      padding: 0 10px;
    }

    .alert-success-banner {
      background: #ecfdf5;
      border: 1px solid #a7f3d0;
      border-radius: 12px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.8rem;
      color: #065f46;
      font-weight: 600;
      margin-top: 24px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.1);
    }

    /* ==========================================================================
       APP HEADERS & TOP NAVIGATION
       ========================================================================== */
    .app-screen-header {
      padding: 12px 18px;
      background: #ffffff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #f1f5f9;
      position: sticky;
      top: 0;
      z-index: 40;
    }

    .header-brand-title {
      display: flex;
      align-items: baseline;
      gap: 6px;
    }

    .header-brand-title h2 {
      font-size: 1.15rem;
      font-weight: 800;
      color: #1e1b4b;
    }

    .header-brand-title span.role-tag {
      font-size: 0.75rem;
      font-weight: 700;
      color: #64748b;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-btn-round {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      cursor: pointer;
      position: relative;
    }

    .red-dot-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      width: 7px;
      height: 7px;
      background: #ef4444;
      border-radius: 50%;
      border: 1px solid #ffffff;
    }

    .user-avatar-gs {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #475569;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Sub-bar for GS scope notice */
    .gs-scope-notice {
      background: #f1f5f9;
      padding: 4px 16px;
      font-size: 0.68rem;
      color: #64748b;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    /* ==========================================================================
       ADMIN DASHBOARD (BOARD 2)
       ========================================================================== */
    .greeting-title {
      font-size: 1.35rem;
      font-weight: 800;
      color: #0f172a;
      margin: 16px 18px 12px;
    }

    .stats-2x2-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      padding: 0 16px 16px;
    }

    .stat-card-colored {
      border-radius: 16px;
      padding: 16px 14px;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 102px;
      box-shadow: 0 8px 18px -4px rgba(0, 0, 0, 0.15);
      position: relative;
      overflow: hidden;
    }

    .stat-card-blue {
      background: linear-gradient(135deg, #1e40af 0%, #2563eb 100%);
    }

    .stat-card-purple {
      background: linear-gradient(135deg, #4c1d95 0%, #6b21a8 100%);
    }

    .stat-card-navy {
      background: linear-gradient(135deg, #1e3a8a 0%, #1e293b 100%);
    }

    .stat-card-gold {
      background: linear-gradient(135deg, #b45309 0%, #d97706 100%);
    }

    .stat-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 1.15rem;
      opacity: 0.9;
    }

    .stat-card-label {
      font-size: 0.72rem;
      font-weight: 600;
      opacity: 0.9;
      margin-top: 8px;
    }

    .stat-card-val {
      font-size: 1.45rem;
      font-weight: 800;
      line-height: 1.1;
      margin-top: 2px;
    }

    /* Quick Actions */
    .section-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: #0f172a;
      padding: 0 18px 8px;
    }

    .quick-actions-row {
      display: flex;
      gap: 10px;
      padding: 0 16px 20px;
    }

    .btn-quick-action {
      flex: 1;
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.8rem;
      font-weight: 700;
      color: #1e293b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: all 0.15s ease;
    }

    .btn-quick-action:hover {
      background: #f8fafc;
      border-color: #cbd5e1;
    }

    /* College List Cards (Image 2) */
    .college-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      margin: 0 16px 12px;
      border: 1px solid #f1f5f9;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03);
    }

    .college-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .college-name {
      font-size: 1rem;
      font-weight: 800;
      color: #0f172a;
    }

    .badge-pill {
      font-size: 0.68rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 9999px;
      display: inline-flex;
      align-items: center;
    }

    .badge-active {
      background: #dcfce7;
      color: #15803d;
    }

    .badge-pending {
      background: #fef3c7;

      // Initialize App
      init() {
        this.loadMode();
        this.bindEvents();
        this.render();
      },

      loadMode() {
        if (this.state.mode === 'with_data') {
          this.state.data = JSON.parse(JSON.stringify(this.sampleData));
        } else {
          // Without data mode: empty lists as requested
          this.state.data = {
            colleges: [],
            events: [],
            categories: [
              { id: 'cat1', name: 'Music & Dance', count: 0, icon: 'fa-music' },
              { id: 'cat2', name: 'Fashion & Art', count: 0, icon: 'fa-pen-ruler' },
              { id: 'cat3', name: 'Drama', count: 0, icon: 'fa-masks-theater' },
              { id: 'cat4', name: 'Gaming', count: 0, icon: 'fa-gamepad' }
            ],
            participants: [],
            registrations: []
          };
        }
      },

      bindEvents() {
        // Toggle Without Data vs With Data
        document.getElementById('toggleDataBtn').addEventListener('click', () => {
          this.state.mode = (this.state.mode === 'without_data') ? 'with_data' : 'without_data';
          this.loadMode();
          document.getElementById('dataModeLabel').innerText = (this.state.mode === 'without_data')
            ? 'Mode: Without Data (Clean)'
            : 'Mode: With Sample Data';
          document.getElementById('toggleDataBtn').classList.toggle('gold-active', this.state.mode === 'with_data');
          this.showToast((this.state.mode === 'without_data') ? 'Clean state: 0 data loaded' : 'Sample design data loaded');
          this.render();
        });

        // Switch Role
        document.getElementById('switchRoleBtn').addEventListener('click', () => {
          this.state.currentRole = (this.state.currentRole === 'admin') ? 'gs' : 'admin';
          document.getElementById('roleLabel').innerText = `Role: ${this.state.currentRole === 'admin' ? 'Admin' : 'College GS'}`;
          this.state.currentScreen = (this.state.currentRole === 'admin') ? 'admin_dashboard' : 'gs_dashboard';
          document.getElementById('screenJumpSelect').value = this.state.currentScreen;
          this.showToast(`Switched view to ${this.state.currentRole.toUpperCase()}`);
          this.render();
        });

        // Jump to screen from select
        document.getElementById('screenJumpSelect').addEventListener('change', (e) => {
          this.navigateTo(e.target.value);
        });

        // Gallery Mode toggle
        document.getElementById('galleryToggleBtn').addEventListener('click', () => {
          this.state.isGalleryMode = !this.state.isGalleryMode;
          document.getElementById('galleryToggleBtn').classList.toggle('active', this.state.isGalleryMode);
          if (this.state.isGalleryMode) {
            document.getElementById('singlePhoneStage').style.display = 'none';
            document.getElementById('galleryStage').style.display = 'block';
            this.renderGallery();
          } else {
            document.getElementById('singlePhoneStage').style.display = 'flex';
            document.getElementById('galleryStage').style.display = 'none';
            this.render();
          }
        });
      },

      navigateTo(screenId) {
        this.state.currentScreen = screenId;
        document.getElementById('screenJumpSelect').value = screenId;
        // Auto update role if jumping to role-specific screens
        if (screenId.startsWith('admin_')) this.state.currentRole = 'admin';
        if (screenId.startsWith('gs_')) this.state.currentRole = 'gs';
        document.getElementById('roleLabel').innerText = `Role: ${this.state.currentRole === 'admin' ? 'Admin' : 'College GS'}`;
        this.closeModal();
        this.render();
      },

      showToast(msg) {
        const box = document.getElementById('toastBox');
        document.getElementById('toastMsg').innerText = msg;
        box.style.display = 'flex';
        setTimeout(() => { box.style.display = 'none'; }, 3200);
      },

      closeModal(e) {
        if (e) e.stopPropagation();
        document.getElementById('activeModalOverlay').style.display = 'none';
      },

      openModal(html) {
        document.getElementById('activeModalContent').innerHTML = html;
        document.getElementById('activeModalOverlay').style.display = 'flex';
      },

      // Export / Download CSV File for Reports
      downloadParticipantRoster() {
        const list = (this.state.data.participants.length > 0)
          ? this.state.data.participants
          : this.sampleData.participants;

        let csv = "Student Name,College,Department,Academic Year,Event,Phone,Email,Status\n";
        list.forEach(p => {
          csv += `"${p.name}","${p.college}","${p.dept}","${p.year}","${p.event}","${p.phone}","${p.email}","${p.status}"\n`;
        });

        const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.setAttribute("href", url);
        link.setAttribute("download", "Melange26_Participant_Roster_StXaviers.csv");
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        this.showToast("Roster CSV downloaded successfully!");
      },

      // ======================================================================

      // ======================================================================
      render() {
        const viewport = document.getElementById('screenViewport');
        const statusBar = document.getElementById('phoneStatusBar');
        const bottomNav = document.getElementById('mobileBottomNav');
        const homePill = document.getElementById('homeIndicatorPill');

        // Dark or light status bar based on screen
        if (this.state.currentScreen === 'splash') {
          statusBar.className = 'phone-status-bar dark-status';
          homePill.className = 'home-indicator-pill dark-bar';
          bottomNav.style.display = 'none';
        } else {
          statusBar.className = 'phone-status-bar';
          homePill.className = 'home-indicator-pill';
        }

        // Render target screen HTML
        let html = '';
        switch (this.state.currentScreen) {
          case 'splash':
            html = this.views.splash();
            bottomNav.style.display = 'none';
            break;
          case 'login':
            html = this.views.login();
            bottomNav.style.display = 'none';
            break;

            html = this.views.roleSelect();
            bottomNav.style.display = 'none';
            break;

            this.renderBottomNav('admin', 'colleges');
            break;
          case 'admin_events':

            break;
          case 'admin_regs':

        const eventInput = document.getElementById('addPartEvent');

        const dept = deptInput ? deptInput.value : 'Computer Science';
        const phone = phoneInput ? phoneInput.value : '+91 99999 00000';
        const email = emailInput ? emailInput.value : 'student@college.edu';
        const event = eventInput ? eventInput.value : 'Battle of the Bands';

        const newP = {

          name,
          college: "St. Xavier's College",
          dept,
          year: '3rd Year',
          phone,
          email,

          status: 'Pending'

          val = Math.max(0, val + delta);
          el.innerText = val;
        }
      },

      saveNewEvent() {
        const nameInput = document.getElementById('newEventName');
        const descInput = document.getElementById('newEventDesc');
        const catInput = document.getElementById('newEventCategory');
        const timeInput = document.getElementById('newEventTime');
        const venueInput = document.getElementById('newEventVenue');
        const limitVal = document.getElementById('participantLimitVal');

        const name = (nameInput && nameInput.value.trim()) || 'New Fest Event';
        const desc = descInput ? descInput.value : 'Event description';
        const cat = catInput ? catInput.value : 'Cultural';
        const time = timeInput ? timeInput.value : '12:00 PM';
        const venue = venueInput ? venueInput.value : 'Main Arena';
        const slotsTotal = limitVal ? (parseInt(limitVal.innerText, 10) || 5) : 5;

        const newEvt = {
          id: 'e_' + Date.now(),
          name,
          category: cat,
          categoryKey: 'cultural',
          date: 'Feb 25, 2026',
          time,
          venue,
          status: 'Open',
          statusBadge: 'Registration Open',
          badgeClass: 'badge-active',
          slotsUsed: 0,
          slotsTotal,
          icon: 'fa-solid fa-star',
          iconColor: '#2563eb',
          desc
        };

        this.state.data.events.unshift(newEvt);
        this.showToast(`Created event: ${name}`);
        this.navigateTo('events_crud');
      },

      updateRegStatus(regId, newStatus) {
        const r = this.state.data.registrations.find(x => x.id === regId);
        if (r) {
          r.status = newStatus;
          r.statusClass = (newStatus === 'Approved') ? 'badge-active' : (newStatus === 'Rejected') ? 'badge-full' : 'badge-pending';
          this.showToast(`Registration marked as ${newStatus}`);
          this.render();
        }
      },

      openRegDetails(regId) {
        const r = this.state.data.registrations.find(x => x.id === regId) || this.sampleData.registrations[0];
        this.state.selectedRegistration = r;
        this.navigateTo('reg_details');
      },

      deleteParticipant(partId) {
        this.state.data.participants = this.state.data.participants.filter(p => p.id !== partId);
        this.showToast("Participant removed");
        this.render();
      },

      addCollegePrompt() {
        const name = prompt("Enter College Name:", "Mumbai University Tech Campus");
        if (name) {
          this.state.data.colleges.unshift({
            id: 'c_' + Date.now(),
            name,
            status: 'Active',
            gs: 'College Representative (GS)',
            participants: 0
          });
          this.showToast(`Added college: ${name}`);
          this.render();
        }
      },

      addCategoryPrompt() {
        const name = prompt("Enter Category Name:", "Literary & Debate");
        if (name) {
          this.state.data.categories.push({
            id: 'cat_' + Date.now(),
            name,
            count: 0,
            icon: 'fa-book'
          });
          this.showToast(`Added category: ${name}`);
          this.render();
        }
      },

      toggleCategoryFilter(val) {
        this.state.activeCategoryFilter = val;
        this.showToast(`Category filter ${val ? 'enabled' : 'disabled'}`);
        this.render();
      },

      filterEvents(val) {
        // dynamic filter
      },

      filterColleges(val) {
        // dynamic filter
      },

      filterParticipants(val) {
        // dynamic filter
      },

      filterRegistrations(val) {
        // dynamic filter
      },

      clearFilters() {
        this.showToast("Filters cleared");
        this.navigateTo('regs_list');
      },

      applyFilters() {
        this.showToast("Filters applied");
      },

      // ======================================================================
      // FIGMA GALLERY PRESENTATION (ALL 5 BOARDS SIDE-BY-SIDE)
      // ======================================================================
      renderGallery() {
        const container = document.getElementById('galleryContainer');
        const boards = [
          {
            title: "Board 1: Mobile-First AI Authentication Design",
            sub: "Optimized for 360px-430px smartphone screen",
            screens: ['splash', 'login', 'role_select', 'reset_password'],
            labels: ['Splash Screen', 'Login Screen', 'Role Based Login Screen', 'Password Reset Screen']
          },
          {
            title: "Board 2: Mobile-First Admin Management UI",
            sub: "Melange Event Management Portal (Admin)",
            screens: ['admin_dashboard', 'admin_colleges', 'admin_events', 'admin_regs'],
            labels: ['Dashboard Home', 'College Management', 'Event Management', 'Registration Overview']
          },
          {
            title: "Board 3: Mobile-First College GS Portal UI",
            sub: "Melange Event Management Portal (GS)",
            screens: ['gs_dashboard', 'gs_participants', 'gs_add_participant', 'gs_reports'],
            labels: ['Dashboard Home', 'Participant Management', 'Add Participant (Full Form)', 'Events & Reports (With download)']
          },
          {
            title: "Board 4: Events & Categories Management",
            sub: "Create, Edit, Delete & Grouping",
            screens: ['events_crud', 'create_event', 'categories', 'events_crud'],
            labels: ['Events List & Filter', 'Create New Event', 'Event Categories', 'Delete Event Modal']
          },
          {
            title: "Board 5: Registrations Management, Filter & Empty State",
            sub: "Comprehensive Review & Audit System",
            screens: ['regs_list', 'regs_list', 'reg_details', 'empty_state'],
            labels: ['Registrations (List View)', 'Filter & Sort (Sheet)', 'Registration Details', 'Empty State']
          }
        ];

        let html = '';
        boards.forEach(board => {
          html += `
            <div style="margin-bottom: 50px;">
              <h2 class="gallery-board-title">${board.title}</h2>
              <div class="gallery-board-sub">${board.sub}</div>
              <div class="gallery-4cols">
                ${board.screens.map((screenId, idx) => `
                  <div>
                    <div class="gallery-phone-card" style="position: relative;">
                      <div class="phone-status-bar ${screenId === 'splash' ? 'dark-status' : ''}" style="height: 28px;">
                        <span>12:30</span>
                        <div class="status-notch-cam"></div>
                        <div class="status-icons">
                          <i class="fa-solid fa-wifi"></i>
                          <i class="fa-solid fa-battery-full"></i>
                        </div>
                      </div>
                      <div class="screen-viewport" style="flex: 1; pointer-events: auto;">
                        ${App.views[screenId] ? App.views[screenId]() : ''}
                      </div>
                    </div>
                    <div class="gallery-screen-label">${board.labels[idx]}</div>
                  </div>
                `).join('')}
              </div>
            </div>
          `;
        });

        container.innerHTML = html;
      }
    };

    // Auto boot on load
    window.addEventListener('DOMContentLoaded', () => {
      App.init();
    });
  </script>
